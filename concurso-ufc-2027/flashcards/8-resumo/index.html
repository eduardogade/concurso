<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards · Prova Escrita UFC</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hud">
    <span id="posicao">Carregando…</span>
    <span id="progresso"></span>
  </header>

  <main>
    <section id="card" class="card">
      <noscript><p>Ative o JavaScript para usar o player.</p></noscript>
    </section>
  </main>

  <footer class="teclas" aria-label="Teclas">
    <span><kbd>←</kbd> voltar passo</span>
    <span><kbd>→</kbd> revelar / avançar</span>
    <span><kbd>Shift</kbd> card anterior</span>
    <span><kbd>Space</kbd> próximo card</span>
    <span><kbd>1</kbd>–<kbd>0</kbd> ponto</span>
    <span><kbd>R</kbd> nova ordem</span>
    <span><kbd>S</kbd> sequencial/aleatório</span>
    <span><kbd>F</kbd> fullscreen</span>
  </footer>
</body>
</html>
